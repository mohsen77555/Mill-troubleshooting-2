plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alhadi.meshcheck'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alhadi.meshcheck'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
