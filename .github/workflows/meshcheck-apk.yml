name: Build MeshCheck Sefar APK

on:
  push:
    branches:
      - meshcheck-sefar-build
    paths:
      - "meshcheck-android/**"
      - ".github/workflows/meshcheck-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshcheck-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run mesh analysis tests
        run: |
          node tests/mesh-analyzer.test.js
          node tests/auto-inspection.test.js
          node tests/live-stabilizer.test.js
          node tests/sefar-catalog-source.test.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test 20 mm physical-window thread measurement
        run: |
          mkdir -p build/thread-counter-test
          javac -d build/thread-counter-test \
            app/src/main/java/com/alhadi/meshcheck/ThreadProfileCounter.java \
            app/src/main/java/com/alhadi/meshcheck/ThreadCountConsensus.java \
            app/src/main/java/com/alhadi/meshcheck/Marker20mmDetector.java \
            tests/ThreadProfileCounterTest.java \
            tests/ThreadCountConsensusTest.java \
            tests/Physical20mmWindowTest.java
          java -cp build/thread-counter-test ThreadProfileCounterTest
          java -cp build/thread-counter-test ThreadCountConsensusTest
          java -cp build/thread-counter-test Physical20mmWindowTest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/MeshCheck-Sefar-v0.16.0-fixed20mm-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshCheck-Sefar-v0.16.0-fixed20mm-debug-apk
          path: meshcheck-android/output/MeshCheck-Sefar-v0.16.0-fixed20mm-debug.apk
          if-no-files-found: error
